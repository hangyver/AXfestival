<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="제11회 대한민국 약사학술제 강의 일정"><title>강의 일정 | 제11회 대한민국 약사학술제</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head>
<body data-page="program"><div data-header></div><main class="pt-20">
  <section class="bg-[#071b32] py-20 text-white md:py-28"><div class="mx-auto max-w-7xl px-5 lg:px-8"><p class="section-label text-xs font-extrabold text-cyan-300">Lecture program</p><div class="mt-5 grid gap-8 lg:grid-cols-[1fr_auto] lg:items-end"><div><h1 class="font-display text-4xl font-extrabold tracking-[-.04em] md:text-6xl">강의 일정</h1><p class="mt-5 max-w-2xl text-lg leading-8 text-slate-300">세 개 강의실에서 한 시간 단위로 진행됩니다. 강사와 강의 내용은 확정되는 대로 업데이트됩니다.</p></div><div class="rounded-2xl border border-white/10 bg-white/5 px-6 py-4 text-sm text-slate-300"><strong class="block text-white">2026. 11. 29. 일요일</strong>10:00 — 18:00</div></div></div></section>
  <section class="bg-[#f5f9fb] py-20"><div class="mx-auto max-w-7xl px-5 lg:px-8">
    <div class="mb-9 flex flex-wrap gap-2" aria-label="강의실 필터"><button data-filter="all" aria-pressed="true" class="filter-button rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-bold">전체</button><button data-filter="world" aria-pressed="false" class="filter-button rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-bold">3F 세계로룸</button><button data-filter="creation1" aria-pressed="false" class="filter-button rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-bold">4F 창조룸 Ⅰ</button><button data-filter="creation2" aria-pressed="false" class="filter-button rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-bold">4F 창조룸 Ⅱ</button></div>
    <div class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-[0_20px_60px_rgba(7,25,47,.06)]">
      <div class="hidden grid-cols-[120px_170px_1fr] border-b border-slate-200 bg-slate-50 px-6 py-4 text-xs font-extrabold tracking-widest text-slate-500 md:grid"><span>TIME</span><span>ROOM</span><span>SESSION</span></div>
      <div id="programList"></div>
    </div>
    <div class="mt-7 rounded-2xl border border-blue-100 bg-blue-50 p-5 text-sm leading-6 text-blue-900"><strong>일정 안내</strong><br>강의 주제와 강사는 현재 섭외 및 편성 중입니다. 세부 일정은 확정 후 공개되며, 운영 상황에 따라 일부 변경될 수 있습니다.</div>
  </div></section>
</main><div data-footer></div><script src="app.js"></script><script>
const rooms=[['world','3F','세계로룸','text-blue-700 bg-blue-50'],['creation1','4F','창조룸 Ⅰ','text-cyan-700 bg-cyan-50'],['creation2','4F','창조룸 Ⅱ','text-emerald-700 bg-emerald-50']];
const times=Array.from({length:8},(_,i)=>`${String(10+i).padStart(2,'0')}:00`);
document.getElementById('programList').innerHTML=times.flatMap((time,i)=>rooms.map(([id,floor,room,color])=>`<article class="program-row grid gap-3 border-b border-slate-100 px-5 py-5 last:border-0 md:grid-cols-[120px_170px_1fr] md:items-center md:px-6" data-room="${id}"><time class="font-display text-lg font-extrabold">${time}<span class="ml-2 text-xs font-medium text-slate-400 md:block md:ml-0">— ${String(11+i).padStart(2,'0')}:00</span></time><div><span class="inline-flex rounded-full px-3 py-1.5 text-xs font-extrabold ${color}">${floor} · ${room}</span></div><div><h2 class="font-bold text-slate-700">강의 주제 추후 공개</h2><p class="mt-1 text-sm text-slate-400">강사 섭외 중</p></div></article>`)).join('');
</script></body></html>
